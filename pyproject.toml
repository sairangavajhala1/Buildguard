[project]
name = "buildguard-backend"
version = "0.1.0"
description = "Dodo Payments escrow backend for Buildguard"
requires-python = ">=3.9"
dependencies = [
    "dodopayments>=1.115.0",
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]